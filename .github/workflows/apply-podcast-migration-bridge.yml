name: Apply temporary podcast migration bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-podcast-migration-bridge.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify temporary Clearforge identity on new RSS URL
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>Clearforge AI Briefing</title>' public/podcast/feed.xml
          grep -q '<itunes:name>Clearforge</itunes:name>' public/podcast/feed.xml
          grep -q '<guid isPermaLink="false">clearforge:' public/podcast/feed.xml
          grep -q 'https://sapiverforge-daily-brief.netlify.app/podcast/feed.xml' public/podcast/feed.xml

      - name: Deploy temporary bridge directly to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 8e72a4fc-5ad6-4377-8f4a-399d4c936060
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=public \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="Temporary Clearforge podcast migration bridge"
