name: Clearforge Approve and Publish

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Exact edition ID from the Release Desk, for example 2026-07-28 or 2026-07-28-considered"
        required: true
        type: string
      confirmation:
        description: "Type APPROVE followed by the exact edition ID"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: clearforge-human-publication
  cancel-in-progress: false

env:
  BLOG_BASE_URL: "https://clearforge-daily-brief.netlify.app"
  NETLIFY_SITE_ID: "8e72a4fc-5ad6-4377-8f4a-399d4c936060"

jobs:
  approve-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate approval input
        shell: bash
        run: |
          set -euo pipefail
          EDITION="${{ github.event.inputs.edition }}"
          CONFIRMATION="${{ github.event.inputs.confirmation }}"
          if [[ ! "${EDITION}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?$ ]]; then
            echo "::error::Invalid edition identifier."
            exit 1
          fi
          if [ "${CONFIRMATION}" != "APPROVE ${EDITION}" ]; then
            echo "::error::Confirmation must exactly match: APPROVE ${EDITION}"
            exit 1
          fi
          echo "CLEARFORGE_DATE=${EDITION}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_CONFIRMATION=${CONFIRMATION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Record Jim's release approval
        env:
          CLEARFORGE_APPROVER: ${{ github.actor }}
        run: npm run release:approve

      - name: Publish approved Irene podcast files
        shell: bash
        run: |
          set -euo pipefail
          audio="drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp3"
          video="drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp4"
          metadata="drafts/${CLEARFORGE_DATE}/podcast/episode-metadata.json"
          if [[ -s "${audio}" && -s "${metadata}" ]]; then
            PODCAST_KIND=daily \
            EPISODE_SLUG="${CLEARFORGE_DATE}" \
            SOURCE_MP3="${audio}" \
            SOURCE_MP4="$([[ -s "${video}" ]] && printf '%s' "${video}" || true)" \
            METADATA_PATH="${metadata}" \
            PODCAST_BASE_URL="${BLOG_BASE_URL}" \
            node scripts/publish-podcast-feed.mjs
          else
            echo "No approved Irene MP3 package is present; podcast publication skipped."
          fi

      - name: Build approved site
        run: npm run build:site

      - name: Export human-approved distribution bundle
        run: npm run export:approved

      - name: Syndicate approved feature to DEV
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        run: npm run syndicate:dev

      - name: Commit approved publication state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add -- drafts media bridge public
          if git diff --cached --quiet; then
            echo "No approved publication changes to commit."
          else
            git commit -m "Publish human-approved Clearforge edition ${CLEARFORGE_DATE}"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              echo "Push attempt ${attempt} failed; retrying."
              git rebase --abort 2>/dev/null || true
              sleep 2
              if [ "${attempt}" = "3" ]; then exit 1; fi
            done
          fi

      - name: Deploy approved site to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=public \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="Human-approved Clearforge ${CLEARFORGE_DATE}"

      - name: Dispatch approved social package
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing CROSS_REPO_GITHUB_TOKEN repository secret."
            exit 1
          fi
          PAYLOAD="{\"event_type\":\"clearforge_publish\",\"client_payload\":{\"date\":\"${CLEARFORGE_DATE}\",\"human_approved\":true,\"approved_by\":\"${{ github.actor }}\"}}"
          gh api repos/sapiverpress-studio/SapiverPress_comic_public/dispatches --method POST --input - <<< "${PAYLOAD}"
          echo "Dispatched human-approved social package for ${CLEARFORGE_DATE}."

      - name: Publication summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Clearforge human publication"
            echo
            echo "- Edition: ${CLEARFORGE_DATE}"
            echo "- Approver: ${{ github.actor }}"
            echo "- Automatic publication: disabled"
            echo "- Disclosure: Produced with AI assistance and released with human approval by Clearforge."
          } >> "$GITHUB_STEP_SUMMARY"
