name: Approve Sapiver Forge Weekly Promo Pack
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact 64-character candidate ID
        required: true
permissions:
  actions: read
  contents: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo '${{ inputs.candidate_id }}'|grep -Eq '^[a-f0-9]{64}$'
      - name: Download and verify candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          row="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts[]|select(.name|endswith(\"-$CID\"))|[.id,.name]|@tsv"|head -n1)"
          test -n "$row"
          aid="${row%%$'\t'*}"
          name="${row#*$'\t'}"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > candidate.zip
          mkdir approved
          unzip -q candidate.zip -d approved
          test "$(cat approved/candidate-id.txt)" = "$CID"
          (cd approved && sha256sum -c file-hashes.sha256)
          echo "APPROVED_NAME=${name/candidate/approved}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APPROVED_NAME }}
          path: approved/
          retention-days: 30
      - name: Build approved distribution bridge
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y ffmpeg >/dev/null
          BRIDGE="bridge/sapiver-forge-weekly/latest"
          rm -rf "$BRIDGE"
          mkdir -p "$BRIDGE/images" "$BRIDGE/video"
          cp approved/weekly-pack.json "$BRIDGE/weekly-pack.json"
          cp approved/candidate-id.txt "$BRIDGE/candidate-id.txt"
          node <<'NODE'
          const fs=require('fs');
          const pack=JSON.parse(fs.readFileSync('approved/weekly-pack.json','utf8'));
          if(!Array.isArray(pack.posts)||pack.posts.length!==7) throw new Error('Approved weekly pack must contain seven posts.');
          fs.writeFileSync('bridge/sapiver-forge-weekly/latest/approved-manifest.json',JSON.stringify({
            schema_version:3,
            approved:true,
            candidate_id:pack.candidate_id,
            week:pack.week,
            approved_at:new Date().toISOString(),
            posts:pack.posts.map(p=>({
              index:p.index,
              day:p.day,
              hook:p.hook,
              facebook_post:p.facebook_post,
              social_comment:p.social_comment,
              hashtags:p.hashtags,
              pinterest_title:p.hook.replace(/[.?]$/,''),
              pinterest_description:`${p.narration}\n\nLink in bio.\n\n${p.hashtags.join(' ')}`,
              youtube_title:p.youtube_title,
              youtube_description:p.youtube_description,
              product_url:p.product_url,
              image:`images/${String(p.index).padStart(2,'0')}-${p.day.toLowerCase()}.png`,
              video:`video/${String(p.index).padStart(2,'0')}-${p.day.toLowerCase()}.mp4`
            }))
          },null,2)+'\n');
          NODE
          for video in approved/video/*.mp4; do
            base="$(basename "$video" .mp4)"
            cp "$video" "$BRIDGE/video/$base.mp4"
            test -s "$BRIDGE/video/$base.mp4"
            ffmpeg -nostdin -hide_banner -loglevel error -y -ss 0.2 -i "$video" -frames:v 1 "$BRIDGE/images/$base.png"
            test -s "$BRIDGE/images/$base.png"
          done
          test "$(find "$BRIDGE/images" -type f -name '*.png' | wc -l)" -eq 7
          test "$(find "$BRIDGE/video" -type f -name '*.mp4' | wc -l)" -eq 7
          (cd "$BRIDGE" && find . -type f ! -name file-hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > file-hashes.sha256)
          (cd "$BRIDGE" && sha256sum -c file-hashes.sha256)
      - name: Publish approved bridge to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sapiver-forge-approval-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bridge/sapiver-forge-weekly/latest
          if git diff --cached --quiet; then
            echo "Approved bridge already matches this candidate."
            exit 0
          fi
          git commit -m "Publish approved Sapiver Forge weekly distribution bridge [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push
