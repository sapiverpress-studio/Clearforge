name: Sapiver Forge Daily Autopilot

on:
  workflow_dispatch:
    inputs:
      edition_mode:
        description: "Fresh research or alternate angle from today's source base"
        required: true
        default: "fresh"
        type: choice
        options:
          - fresh
          - alternate
      angle:
        description: "Alternate-angle lens"
        required: false
        default: "creator_workflow"
        type: choice
        options:
          - creator_workflow
          - risk_control
          - beginner_learning
          - business_systems
          - considered_question
      generate_podcast_audio:
        description: "Generate the full Gemini Kore podcast MP3 for this manual run"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 4 * * *"
    - cron: "15 4 * * *"
    - cron: "15 5 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: clearforge-daily-autopilot
  cancel-in-progress: false

env:
  BLOG_BASE_URL: "https://sapiverforge-daily-brief.netlify.app"
  NETLIFY_SITE_ID: "8e72a4fc-5ad6-4377-8f4a-399d4c936060"

jobs:
  autopilot:
    runs-on: ubuntu-latest

    steps:
      - name: Decide whether this is a UK run window
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "edition=${{ github.event.inputs.edition_mode }}" >> "$GITHUB_OUTPUT"
            echo "angle=${{ github.event.inputs.angle }}" >> "$GITHUB_OUTPUT"
            echo "podcast_audio=${{ github.event.inputs.generate_podcast_audio }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_TIME="$(TZ=Europe/London date +%H:%M)"
          LOCAL_DAY="$(TZ=Europe/London date +%u)"
          LOCAL_DATE="$(TZ=Europe/London date +%F)"
          CAMPAIGN_ACTIVE=false
          if [[ "${LOCAL_DATE}" > "2026-08-02" && "${LOCAL_DATE}" < "2026-09-02" ]]; then CAMPAIGN_ACTIVE=true; fi
          echo "Europe/London local time: ${LOCAL_TIME}; weekday: ${LOCAL_DAY}"
          if [ "${LOCAL_TIME}" = "04:30" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "edition=fresh" >> "$GITHUB_OUTPUT"
            echo "angle=creator_workflow" >> "$GITHUB_OUTPUT"
            if [ "${CAMPAIGN_ACTIVE}" = "true" ]; then echo "podcast_audio=false" >> "$GITHUB_OUTPUT"; elif [ "${LOCAL_DAY}" = "4" ]; then echo "podcast_audio=true" >> "$GITHUB_OUTPUT"; else echo "podcast_audio=false" >> "$GITHUB_OUTPUT"; fi
          elif [ "${LOCAL_TIME}" = "05:15" ] && [ "${CAMPAIGN_ACTIVE}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "edition=fresh" >> "$GITHUB_OUTPUT"
            echo "angle=creator_workflow" >> "$GITHUB_OUTPUT"
            if [ "${LOCAL_DAY}" = "4" ]; then echo "podcast_audio=true" >> "$GITHUB_OUTPUT"; else echo "podcast_audio=false" >> "$GITHUB_OUTPUT"; fi
          elif [ "${LOCAL_TIME}" = "16:30" ] && [ "${CAMPAIGN_ACTIVE}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "edition=alternate" >> "$GITHUB_OUTPUT"
            echo "angle=considered_question" >> "$GITHUB_OUTPUT"
            echo "podcast_audio=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            echo "edition=fresh" >> "$GITHUB_OUTPUT"
            echo "angle=creator_workflow" >> "$GITHUB_OUTPUT"
            echo "podcast_audio=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set edition identity
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          BASE_DATE="$(TZ=Europe/London date +%F)"
          ANGLE="${{ steps.gate.outputs.angle }}"
          case "${ANGLE}" in
            creator_workflow) ANGLE_SLUG="creator" ;;
            risk_control) ANGLE_SLUG="risk" ;;
            beginner_learning) ANGLE_SLUG="beginner" ;;
            business_systems) ANGLE_SLUG="systems" ;;
            considered_question) ANGLE_SLUG="considered" ;;
            *) ANGLE_SLUG="$(printf '%s' "${ANGLE}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')" ;;
          esac
          if [ -z "${ANGLE_SLUG}" ]; then
            ANGLE_SLUG="angle"
          fi
          echo "CLEARFORGE_BASE_DATE=${BASE_DATE}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_ANGLE=${ANGLE}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_ANGLE_SLUG=${ANGLE_SLUG}" >> "$GITHUB_ENV"
          if [ "${{ steps.gate.outputs.edition }}" = "alternate" ]; then
            echo "CLEARFORGE_DATE=${BASE_DATE}-${ANGLE_SLUG}" >> "$GITHUB_ENV"
            echo "Using alternate edition ID: ${BASE_DATE}-${ANGLE_SLUG} from source date ${BASE_DATE} using angle ${ANGLE}"
          else
            echo "CLEARFORGE_DATE=${BASE_DATE}" >> "$GITHUB_ENV"
            echo "Using fresh edition ID: ${BASE_DATE}"
          fi

      - name: Read commercial campaign status
        id: campaign
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          active="$(node -e "const c=require('./config/output-release-validation-campaign.json'); const d=process.env.CLEARFORGE_BASE_DATE; process.stdout.write(String(c.enabled && d >= c.start_date && d <= c.end_date))")"
          echo "active=${active}" >> "$GITHUB_OUTPUT"
          if [ "${active}" = "true" ]; then
            echo "The Output Release Gate commercial validation campaign is active."
          fi

      - name: Skip retry when today's review candidate already exists
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.retry == 'true'
        id: retrycheck
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PREFIX="clearforge-candidate-${CLEARFORGE_DATE}-"
          NAMES="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts" --paginate --jq '.artifacts[].name')"
          if printf '%s\n' "${NAMES}" | grep -q "^${PREFIX}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A sealed review candidate already exists; retry not needed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true'
        run: npm install

      - name: Verify Gemini provider contract
        if: steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true'
        run: node test/gemini-provider-contract.mjs

      - name: Generate fresh research edition
        if: steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true' && steps.gate.outputs.edition == 'fresh'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_RESEARCH_MODEL: ${{ vars.GEMINI_RESEARCH_MODEL || 'gemini-3.6-flash' }}
        run: bash scripts/run-commercial-daily.sh

      - name: Generate alternate-angle edition from today's source base
        if: steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true' && steps.gate.outputs.edition == 'alternate' && steps.campaign.outputs.active != 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          CLEARFORGE_BASE_DATE: ${{ env.CLEARFORGE_BASE_DATE }}
          CLEARFORGE_ANGLE: ${{ env.CLEARFORGE_ANGLE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
        run: npm run angle:alternate

      - name: Determine whether a usable package exists
        id: content
        if: steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true'
        shell: bash
        run: |
          if [ -f "drafts/${CLEARFORGE_DATE}/no-public-content.json" ]; then
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "## Clean skipped day" >> "$GITHUB_STEP_SUMMARY"
            echo "No suitable verified Output Release Gate story was found. No downstream generation, candidate, deployment or publication was started." >> "$GITHUB_STEP_SUMMARY"
          else
            test -s "drafts/${CLEARFORGE_DATE}/structured_output.json"
            echo "usable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild any narrowed verified edition before downstream production
        if: steps.content.outputs.usable == 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
        run: node src/rebuild-narrowed-edition.mjs

      - name: Optimise social content for audience response
        if: steps.content.outputs.usable == 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
        run: npm run social:optimise

      - name: Preserve a usable verified commercial pack after optimisation
        if: steps.content.outputs.usable == 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
        run: node src/ensure-output-usability.mjs

      - name: Generate long-form feature from research pack
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
        run: npm run feature

      - name: Generate daily biggest-story podcast script
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
        run: npm run podcast:daily

      - name: Run automated checks for the human reviewer
        id: automated_checks
        if: steps.content.outputs.usable == 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
        run: npm run validate:auto

      - name: Install FFmpeg for Gemini audio
        if: steps.content.outputs.usable == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate full daily podcast MP3 with Gemini Kore
        id: full_podcast
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true' && steps.gate.outputs.podcast_audio == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
          GEMINI_TTS_VOICE: Kore
          INPUT_PATH: drafts/${{ env.CLEARFORGE_DATE }}/podcast/COPY_PASTE_INTO_ELEVENLABS.txt
        shell: bash
        run: |
          set -euo pipefail
          audio="drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp3"
          hash="$audio.source-sha256"
          source_hash="$(sha256sum "$INPUT_PATH" | cut -d' ' -f1)"
          if [[ -s "$audio" && -s "$hash" && "$(tr -d '\r\n' < "$hash")" == "$source_hash" ]]; then
            echo "Existing Gemini Kore MP3 matches the narration; no Gemini request made."
            exit 0
          fi
          wav="$RUNNER_TEMP/clearforge-kore-${CLEARFORGE_DATE}.wav"
          OUTPUT_PATH="$wav" node scripts/generate-gemini-podcast-wav.mjs
          ffmpeg -hide_banner -loglevel error -y -i "$wav" -codec:a libmp3lame -b:a 128k "$audio"
          [[ -s "$audio" ]] || { echo "MP3 conversion failed: $audio"; exit 1; }
          printf '%s\n' "$source_hash" > "$hash"

      - name: Record Gemini podcast generation warning
        if: always() && steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true' && steps.gate.outputs.podcast_audio == 'true' && steps.full_podcast.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Gemini Kore podcast MP3 not generated"
            echo
            echo "Gemini TTS failed or was unavailable. The podcast MP3 and RSS episode were skipped."
            echo "All other Sapiver Forge outputs will continue."
            echo "The podcast production script remains available in the daily package."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage Gemini Kore episode inside the unpublished candidate
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true' && steps.gate.outputs.podcast_audio == 'true' && steps.full_podcast.outcome == 'success'
        env:
          PODCAST_KIND: daily
          EPISODE_SLUG: ${{ env.CLEARFORGE_DATE }}
          SOURCE_MP3: drafts/${{ env.CLEARFORGE_DATE }}/podcast/clearforge-daily-podcast-${{ env.CLEARFORGE_DATE }}.mp3
          METADATA_PATH: drafts/${{ env.CLEARFORGE_DATE }}/podcast/episode-metadata.json
          PODCAST_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: node scripts/publish-podcast-feed.mjs

      - name: Generate story-specific AI visuals and narration
        if: steps.content.outputs.usable == 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLAB_API }}
          ELEVENLABS_VOICE_ID: w9xM4Spfmuw28ZXAirWK
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: npm run media:ai

      - name: Detect available daily Gemini podcast MP3
        id: podcast_audio
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true'
        shell: bash
        run: |
          audio="drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp3"
          if [[ -s "$audio" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using available Gemini Kore audio: $audio"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No daily Gemini podcast MP3 is available; MP4 generation will be skipped without affecting other outputs."
          fi

      - name: Generate full daily podcast MP4
        id: podcast_video
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true' && steps.podcast_audio.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          bash scripts/generate-podcast-mp4.sh \
            "drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp3" \
            "drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp4" \
            "media/${CLEARFORGE_DATE}/story-1.png"

      - name: Stage MP4 download inside the unpublished candidate
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true' && steps.podcast_video.outcome == 'success'
        env:
          PODCAST_KIND: daily
          EPISODE_SLUG: ${{ env.CLEARFORGE_DATE }}
          SOURCE_MP3: drafts/${{ env.CLEARFORGE_DATE }}/podcast/clearforge-daily-podcast-${{ env.CLEARFORGE_DATE }}.mp3
          SOURCE_MP4: drafts/${{ env.CLEARFORGE_DATE }}/podcast/clearforge-daily-podcast-${{ env.CLEARFORGE_DATE }}.mp4
          METADATA_PATH: drafts/${{ env.CLEARFORGE_DATE }}/podcast/episode-metadata.json
          PODCAST_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: node scripts/publish-podcast-feed.mjs

      - name: Upload daily podcast MP3 and MP4 package
        if: steps.content.outputs.usable == 'true' && steps.campaign.outputs.active != 'true' && steps.podcast_video.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: clearforge-daily-podcast-${{ env.CLEARFORGE_DATE }}
          path: |
            drafts/${{ env.CLEARFORGE_DATE }}/podcast/*.mp3
            drafts/${{ env.CLEARFORGE_DATE }}/podcast/*.mp4
          if-no-files-found: error
          retention-days: 90

      - name: Build exact unpublished candidate site
        if: steps.content.outputs.usable == 'true'
        run: npm run build:site

      - name: Build sealed human review package
        id: candidate
        if: steps.content.outputs.usable == 'true'
        env:
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          CLEARFORGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLEARFORGE_SOURCE_SHA: ${{ github.sha }}
        run: npm run review:human

      - name: Upload exact pending candidate
        if: steps.content.outputs.usable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: clearforge-candidate-${{ env.CLEARFORGE_DATE }}-${{ steps.candidate.outputs.candidate_id }}
          path: candidate-package/**/*
          if-no-files-found: error
          retention-days: 30

      - name: Email exact candidate HTML to Jim
        if: steps.content.outputs.usable == 'true'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          CLEARFORGE_REVIEW_EMAIL: ${{ secrets.CLEARFORGE_REVIEW_EMAIL }}
          BREVO_SENDER_EMAIL: clearforge@sapiverpress.co.uk
          BREVO_SENDER_NAME: Sapiver Forge
          CLEARFORGE_DATE: ${{ env.CLEARFORGE_DATE }}
          CLEARFORGE_CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          CLEARFORGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run review:email

      - name: Candidate summary
        if: steps.content.outputs.usable == 'true'
        shell: bash
        run: |
          {
            echo "## Awaiting Jim's human validation"
            echo
            echo "- Edition: ${CLEARFORGE_DATE}"
            echo "- Candidate: ${{ steps.candidate.outputs.candidate_id }}"
            echo "- Website deployment: not run"
            echo "- Podcast publication: not run"
            echo "- DEV syndication: not run"
            echo "- Social distribution: not run"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload skipped-day evidence
        if: steps.content.outputs.usable == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-skipped-${{ env.CLEARFORGE_DATE }}
          path: |
            drafts/${{ env.CLEARFORGE_DATE }}/no-public-content.json
            drafts/${{ env.CLEARFORGE_DATE }}/source-acquisition.json
            drafts/${{ env.CLEARFORGE_DATE }}/commercial-validation-record.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload source-verification diagnostics after failure
        if: failure() && steps.gate.outputs.run == 'true' && steps.retrycheck.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-diagnostic-${{ env.CLEARFORGE_DATE }}-${{ github.run_id }}
          path: |
            drafts/${{ env.CLEARFORGE_DATE }}/source-acquisition.json
            drafts/${{ env.CLEARFORGE_DATE }}/source-evidence.json
            drafts/${{ env.CLEARFORGE_DATE }}/source-integrity-report.json
            drafts/${{ env.CLEARFORGE_DATE }}/source-prune-state.json
            drafts/${{ env.CLEARFORGE_DATE }}/structured_output.json
            drafts/${{ env.CLEARFORGE_DATE }}/narrowed-edition-rebuild.json
            drafts/${{ env.CLEARFORGE_DATE }}/output-usability-report.json
            drafts/${{ env.CLEARFORGE_DATE }}/fact-discipline-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open final failure issue after retry
        if: failure() && steps.gate.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="Sapiver Forge autopilot failed ${CLEARFORGE_DATE}"
          BODY="The automatic retry also failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "${EXISTING}" ]; then
            gh issue create --title "${TITLE}" --body "${BODY}"
          else
            echo "Failure issue already exists: #${EXISTING}"
          fi
