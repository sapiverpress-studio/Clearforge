name: Deploy Sapiver Forge public changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - "src/build-site.mjs"
      - "scripts/build-sapiver-forge-site.mjs"
      - "scripts/rebrand-public-sapiver-forge.mjs"
      - "scripts/inject-podcast-upload-link.mjs"
      - "scripts/inject-app-privacy-link.mjs"
      - "netlify/functions/**"
      - "netlify.toml"

permissions:
  contents: write

concurrency:
  group: sapiver-forge-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sapiver Forge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Rebrand active website generator source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/build-site.mjs';
          let source = fs.readFileSync(file, 'utf8');
          source = source
            .replaceAll('https://clearforge-daily-brief.netlify.app', 'https://sapiverforge-daily-brief.netlify.app')
            .replaceAll('Clearforge', 'Sapiver Forge');
          fs.writeFileSync(file, source, 'utf8');
          if (source.includes('https://clearforge-daily-brief.netlify.app') || /\bClearforge\b/.test(source)) {
            throw new Error('Active website generator still contains Clearforge branding.');
          }
          console.log('Active website generator now uses Sapiver Forge branding.');
          NODE

      - name: Rebuild complete public website
        env:
          BLOG_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: |
          node src/build-site.mjs
          node scripts/inject-podcast-upload-link.mjs
          node scripts/inject-app-privacy-link.mjs

      - name: Apply Sapiver Forge public branding guard
        run: node scripts/rebrand-public-sapiver-forge.mjs

      - name: Verify active public branding
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.html' --include='*.xml' --include='*.json' --include='*.js' --include='*.txt' --include='*.md' \
            'Clearforge|ClearForge|CLEARFORGE|clearforge-daily-brief\.netlify\.app' public \
            | grep -vE '<guid isPermaLink="false">clearforge:'; then
            echo "::error::Active Clearforge branding remains in the public deployment."
            exit 1
          fi

      - name: Save rebuilt website files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/build-site.mjs public; then
            echo "No generated website changes to commit."
          else
            git config user.name "sapiver-forge-site-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/build-site.mjs public
            git commit -m "Update Sapiver Forge website [skip ci]"
            git push
          fi

      - name: Deploy public to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 8e72a4fc-5ad6-4377-8f4a-399d4c936060
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=public \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="Deploy Sapiver Forge website and public content"
