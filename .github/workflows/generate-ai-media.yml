name: Generate Clearforge AI Media

on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Draft date YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: write

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - name: Install FFmpeg for media inspection
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate AI visuals and narration
        env:
          CLEARFORGE_DATE: ${{ github.event.inputs.date_override }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVELAB_API }}
          ELEVENLABS_VOICE_ID: w9xM4Spfmuw28ZXAirWK
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
        run: npm run media:ai
      - name: Export reviewed bundle
        env:
          CLEARFORGE_DATE: ${{ github.event.inputs.date_override }}
          BLOG_BASE_URL: ${{ vars.BLOG_BASE_URL }}
        run: npm run export:approved
      - name: Commit generated media
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate Clearforge AI media"
          file_pattern: "media/** bridge/**"
