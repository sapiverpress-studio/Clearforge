name: Sapiver Forge Evergreen Guide

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/generate-evergreen-guide.yml"
      - "src/generate-evergreen-explainer.mjs"
      - "src/build-evergreen-guides.mjs"
      - "package.json"
  schedule:
    - cron: "15 9 * * 0"

permissions:
  contents: write

concurrency:
  group: sapiver-forge-evergreen-guide
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Create or update one evergreen guide
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-3.1-flash-lite' }}
        run: npm run evergreen

      - name: Rebuild approved static site
        env:
          BLOG_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: npm run build:site

      - name: Commit evergreen guide and public pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Publish Sapiver Forge evergreen guide"
          file_pattern: "explainers/** public/**"

      - name: Confirm safe scope
        run: |
          echo "Evergreen guide pipeline completed."
          echo "This workflow does not dispatch social publishing or generate ElevenLabs audio."
