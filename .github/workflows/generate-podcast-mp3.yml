name: Generate Sapiver Forge podcast MP3 and MP4

on:
  push:
    paths:
      - "reports/**/COPY_PASTE_INTO_ELEVENLABS.txt"
  workflow_dispatch:
    inputs:
      script_path:
        description: "Optional path to a COPY_PASTE_INTO_ELEVENLABS.txt file"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sapiver-forge-podcast-mp3
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: gemini-3.1-flash-tts-preview
      GEMINI_TTS_VOICE: Kore

    steps:
      - name: Check out Sapiver Forge
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Find narration files
        id: narration
        shell: bash
        run: |
          set -euo pipefail
          list_file="$RUNNER_TEMP/sapiver-forge-narrations.txt"
          requested="${{ github.event.inputs.script_path || '' }}"

          if [[ -n "$requested" ]]; then
            printf '%s\n' "$requested" > "$list_file"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" |
              grep -E '^reports/(weekly|specials)/.+/COPY_PASTE_INTO_ELEVENLABS\.txt$' |
              sort -u > "$list_file" || true
          else
            find reports -type f -name COPY_PASTE_INTO_ELEVENLABS.txt |
              sort |
              tail -n 1 > "$list_file"
          fi

          if [[ ! -s "$list_file" ]]; then
            echo "No narration file was selected."
            exit 1
          fi

          while IFS= read -r script; do
            if [[ ! -f "$script" ]]; then
              echo "Narration file does not exist: $script"
              exit 1
            fi
          done < "$list_file"

          echo "list_file=$list_file" >> "$GITHUB_OUTPUT"

      - name: Generate Kore MP3 and full-length MP4
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "No GEMINI_API_KEY repository secret is configured."
            exit 1
          fi

          while IFS= read -r script; do
            folder="$(dirname "$script")"
            slug="$(basename "$folder")"
            output="$folder/sapiver-forge-spoken-edition-$slug.mp3"
            video="$folder/sapiver-forge-spoken-edition-$slug.mp4"
            hash="$output.source-sha256"
            source_hash="$(sha256sum "$script" | cut -d' ' -f1)"
            if [[ -s "$output" && -s "$hash" && "$(tr -d '\r\n' < "$hash")" == "$source_hash" ]]; then
              echo "Existing Kore MP3 matches the narration; no Gemini request made."
            else
              wav="$RUNNER_TEMP/sapiver-forge-kore-$slug.wav"
              echo "Generating $output from $script with Gemini Kore"
              INPUT_PATH="$script" OUTPUT_PATH="$wav" node scripts/generate-gemini-podcast-wav.mjs
              ffmpeg -hide_banner -loglevel error -y -i "$wav" -codec:a libmp3lame -b:a 128k "$output"
              [[ -s "$output" ]] || { echo "MP3 conversion failed: $output"; exit 1; }
              printf '%s\n' "$source_hash" > "$hash"
            fi
            video_arg=""
            if bash scripts/generate-podcast-mp4.sh "$output" "$video" public/podcast/cover.png; then
              video_arg="$video"
            else
              echo "::warning::MP4 generation failed. The verified MP3 will still be saved and published."
            fi
            metadata="$folder/episode-metadata.json"
            if [[ "$script" == reports/weekly/* ]]; then
              kind="weekly"
            else
              kind="special"
            fi
            PODCAST_KIND="$kind" EPISODE_SLUG="$slug" SOURCE_MP3="$output" SOURCE_MP4="$video_arg" METADATA_PATH="$metadata" PODCAST_BASE_URL="https://sapiverforge-daily-brief.netlify.app" node scripts/publish-podcast-feed.mjs
          done < "${{ steps.narration.outputs.list_file }}"

      - name: Upload MP3 and MP4 package
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-podcast-media-${{ github.run_number }}
          path: |
            reports/**/*.mp3
            reports/**/*.mp4
          if-no-files-found: error
          retention-days: 90

      - name: Save generated podcast media
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- reports public/podcast; then
            echo "No new podcast media changes to commit."
            exit 0
          fi

          git config user.name "sapiver-forge-audio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- 'reports/**/*.mp3' 'reports/**/*.mp3.source-sha256' 'reports/**/*.mp4' public/podcast
          git commit -m "Generate Sapiver Forge podcast MP3 and MP4 with Kore"
          git push
