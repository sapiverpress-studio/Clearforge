name: Release Human-Validated Sapiver Forge Edition

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Exact edition ID from the emailed review HTML"
        required: true
        type: string
      candidate_id:
        description: "Exact 64-character candidate ID from the review email"
        required: true
        type: string
      confirmation:
        description: "Type APPROVE followed by the edition ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: clearforge-human-release
  cancel-in-progress: false

env:
  BLOG_BASE_URL: "https://sapiverforge-daily-brief.netlify.app"
  NETLIFY_SITE_ID: "8e72a4fc-5ad6-4377-8f4a-399d4c936060"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate human release inputs
        shell: bash
        run: |
          set -euo pipefail
          EDITION="${{ github.event.inputs.edition }}"
          CANDIDATE_ID="${{ github.event.inputs.candidate_id }}"
          CONFIRMATION="${{ github.event.inputs.confirmation }}"
          if [[ ! "${EDITION}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?$ ]]; then
            echo "::error::Invalid edition identifier."
            exit 1
          fi
          if [[ ! "${CANDIDATE_ID}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Candidate ID must contain exactly 64 lowercase hexadecimal characters."
            exit 1
          fi
          if [ "${CONFIRMATION}" != "APPROVE ${EDITION}" ]; then
            echo "::error::Confirmation must exactly match: APPROVE ${EDITION}"
            exit 1
          fi
          echo "CLEARFORGE_DATE=${EDITION}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_CANDIDATE_ID=${CANDIDATE_ID}" >> "$GITHUB_ENV"
          echo "CLEARFORGE_CONFIRMATION=${CONFIRMATION}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Download the exact reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="clearforge-candidate-${CLEARFORGE_DATE}-${CLEARFORGE_CANDIDATE_ID}"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" --jq '.artifacts | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::error::No sealed artifact matches that edition and candidate ID."
            exit 1
          fi
          ARCHIVE="${RUNNER_TEMP}/clearforge-candidate.zip"
          STAGE="${RUNNER_TEMP}/clearforge-candidate"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "${ARCHIVE}"
          mkdir -p "${STAGE}"
          unzip -q "${ARCHIVE}" -d "${STAGE}"
          test -f "${STAGE}/drafts/${CLEARFORGE_DATE}/candidate-manifest.json"
          echo "CLEARFORGE_CANDIDATE_STAGE=${STAGE}" >> "$GITHUB_ENV"

      - name: Refuse a candidate built from an outdated production state
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="${CLEARFORGE_CANDIDATE_STAGE}/drafts/${CLEARFORGE_DATE}/candidate-manifest.json"
          SOURCE_COMMIT="$(jq -r '.source_commit // empty' "${MANIFEST}")"
          CURRENT_COMMIT="$(git rev-parse HEAD)"
          if [ -z "${SOURCE_COMMIT}" ] || [ "${SOURCE_COMMIT}" != "${CURRENT_COMMIT}" ]; then
            echo "::error::Production changed after this candidate was generated. Generate and review a fresh candidate so an older site cannot overwrite newer work."
            exit 1
          fi
          while IFS= read -r deleted; do
            [ -z "${deleted}" ] && continue
            if [[ "${deleted}" != public/* || "${deleted}" == *".."* ]]; then
              echo "::error::Unsafe deletion path in candidate: ${deleted}"
              exit 1
            fi
            rm -f -- "${deleted}"
          done < <(jq -r '.deleted_paths[]?' "${MANIFEST}")
          rm -rf "drafts/${CLEARFORGE_DATE}" "media/${CLEARFORGE_DATE}"
          cp -a "${CLEARFORGE_CANDIDATE_STAGE}/." .

      - name: Verify file hashes and record human approval
        env:
          CLEARFORGE_APPROVER: ${{ github.actor }}
        run: npm run release:human

      - name: Export the approved distribution bundle
        run: npm run export:approved

      - name: Commit the exact human-approved release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add -- "drafts/${CLEARFORGE_DATE}" "media/${CLEARFORGE_DATE}" bridge public
          if git diff --cached --quiet; then
            echo "No publication files changed."
          else
            git commit -m "Release human-validated Sapiver Forge edition ${CLEARFORGE_DATE}"
            git push origin HEAD:main
          fi

      - name: Deploy the exact approved site to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir=public \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="Human-validated Sapiver Forge ${CLEARFORGE_DATE} ${CLEARFORGE_CANDIDATE_ID}"

      - name: Syndicate the approved feature to DEV
        env:
          DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
        run: npm run syndicate:dev

      - name: Dispatch the approved social and video package
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Missing CROSS_REPO_GITHUB_TOKEN repository secret."
            exit 1
          fi
          PAYLOAD="{\"event_type\":\"clearforge_publish\",\"client_payload\":{\"date\":\"${CLEARFORGE_DATE}\",\"candidate_id\":\"${CLEARFORGE_CANDIDATE_ID}\",\"human_approved\":true,\"approved_by\":\"${{ github.actor }}\"}}"
          gh api repos/sapiverpress-studio/SapiverPress_comic_public/dispatches --method POST --input - <<< "${PAYLOAD}"

      - name: Human release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sapiver Forge human release"
            echo
            echo "- Edition: ${CLEARFORGE_DATE}"
            echo "- Candidate: ${CLEARFORGE_CANDIDATE_ID}"
            echo "- Approver: ${{ github.actor }}"
            echo "- File identity: verified before release"
            echo "- Disclosure: Produced with AI assistance and released with human approval by Sapiver Forge."
          } >> "$GITHUB_STEP_SUMMARY"
