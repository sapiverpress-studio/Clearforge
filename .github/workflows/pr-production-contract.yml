name: Production contract

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "test/**"
      - "config/**"
      - "package.json"
      - ".github/workflows/daily-draft.yml"
      - ".github/workflows/pr-production-contract.yml"

permissions:
  contents: read

jobs:
  production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /test/
            /config/
            /package.json
            /.github/workflows/daily-draft.yml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - name: Replay failed candidate through production contract
        run: npm run test:end-to-end-production
