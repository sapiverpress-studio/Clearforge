name: Weekly Content Kit Contract

on:
  pull_request:
    paths:
      - 'data/sapiver-forge-products.json'
      - 'src/generate-fresh-weekly-promo-pack.mjs'
      - 'test/weekly-promo-contract.mjs'
      - '.github/workflows/weekly-content-kit.yml'
      - '.github/workflows/promo-contract.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'src/generate-fresh-weekly-promo-pack.mjs'
      - 'test/weekly-promo-contract.mjs'
      - '.github/workflows/promo-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Sapiver Forge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate weekly content kit
        run: node test/weekly-promo-contract.mjs
        env:
          WEEK_ID: contract-test
