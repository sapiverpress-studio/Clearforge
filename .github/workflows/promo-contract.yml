name: Weekly Promo Contract
on:
  pull_request:
    paths:
      - 'data/sapiver-forge-products.json'
      - 'src/generate-weekly-promo-pack.mjs'
      - 'src/render-weekly-promo-video.mjs'
      - 'src/upload-youtube-short.mjs'
      - 'test/weekly-promo-contract.mjs'
      - 'public/products/**'
      - '.github/workflows/weekly-promo-pack.yml'
      - '.github/workflows/approve-weekly-promo.yml'
      - '.github/workflows/youtube-daily-short.yml'
      - '.github/workflows/promo-contract.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            data/sapiver-forge-products.json
            src/generate-weekly-promo-pack.mjs
            src/render-weekly-promo-video.mjs
            test/weekly-promo-contract.mjs
            public/products/gate-system/opportunity-gate/01_Cover.webp
            public/products/gate-system/workflow-control-gate/01_Cover.webp
            public/products/gate-system/output-release-gate/01_Cover.webp
            public/products/gate-system/outcome-review-gate/01_Cover.webp
            public/products/gate-system/complete-bundle/01_Cover.webp
            public/products/notion-workspace/01_Cover.webp
            .github/workflows/weekly-promo-pack.yml
            .github/workflows/approve-weekly-promo.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run promo:validate
        env:
          WEEK_ID: contract-test
