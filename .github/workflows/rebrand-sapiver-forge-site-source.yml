name: Rebrand Sapiver Forge site source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebrand-sapiver-forge-site-source.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sapiver-forge-site-source-rebrand
  cancel-in-progress: false

jobs:
  rebrand-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sapiver Forge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Rebrand active site generator source
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/build-site.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const before = source;

          source = source
            .replaceAll('https://clearforge-daily-brief.netlify.app', 'https://sapiverforge-daily-brief.netlify.app')
            .replaceAll('Clearforge', 'Sapiver Forge');

          if (source === before) {
            console.log('No source replacements were required.');
          } else {
            fs.writeFileSync(file, source, 'utf8');
            console.log('Updated active site generator branding and canonical URL.');
          }

          const forbidden = [
            'https://clearforge-daily-brief.netlify.app',
            'Clearforge'
          ];
          const remaining = forbidden.filter((term) => source.includes(term));
          if (remaining.length) {
            throw new Error(`Active site generator still contains: ${remaining.join(', ')}`);
          }
          NODE

      - name: Rebuild complete public site
        env:
          BLOG_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: npm run build:site

      - name: Apply final public leakage guard
        run: node scripts/rebrand-public-site.mjs

      - name: Verify active public branding
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = [
            'public/index.html',
            'public/features.xml',
            'public/podcast/feed.xml',
            'public/podcast/index.html',
            'public/newsletter/index.html',
            'public/topics/index.html',
            'public/guides/index.html',
            'public/reports/index.html'
          ];
          const failures = [];
          for (const file of roots) {
            if (!fs.existsSync(file)) continue;
            const text = fs.readFileSync(file, 'utf8');
            if (text.includes('https://clearforge-daily-brief.netlify.app')) failures.push(`${file}: old domain`);
            const withoutLegacyGuids = text.replaceAll(/clearforge:[A-Za-z0-9._:-]+/g, '');
            if (/\bClearforge\b/.test(withoutLegacyGuids)) failures.push(`${file}: old visible brand`);
          }
          if (failures.length) throw new Error(`Brand leakage remains:\n${failures.join('\n')}`);
          console.log('Active site pages contain Sapiver Forge branding and the new canonical URL.');
          NODE

      - name: Commit source and rebuilt public site
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/build-site.mjs public; then
            echo "No source or public-site changes to commit."
            exit 0
          fi
          git config user.name "sapiver-forge-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/build-site.mjs public
          git commit -m "Rebrand website source and generated content to Sapiver Forge"
          git push
