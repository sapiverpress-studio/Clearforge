name: Publish and Deploy Sapiver Forge Daily Brief

on:
  workflow_dispatch:
    inputs:
      edition_date:
        description: Optional Daily Brief date (YYYY-MM-DD). Leave blank for today in Europe/London.
        required: false
        type: string
      confirm:
        description: Type SEND to release the current approved newsletter and website edition for this date
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sapiver-forge-daily-newsletter-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Podcast pipeline syntax checks
        run: |
          node --check src/generate-weekly-intelligence-podcast.mjs
          node --check scripts/generate-gemini-podcast-wav.mjs
          node --check scripts/publish-podcast-feed.mjs
          node --check src/gemini-provider.mjs

      - name: Verify human release request
        id: release
        shell: bash
        env:
          DATE: ${{ inputs.edition_date }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "SEND" ] || { echo "Confirmation must be exactly SEND" >&2; exit 1; }
          DATE="${DATE:-$(TZ=Europe/London date +%F)}"
          export DATE
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "Publishing Daily Brief date: $DATE"
          node <<'NODE'
          const fs = require('fs');
          const date = process.env.DATE;
          const manifestPath = `news-intelligence/${date}/manifest.json`;
          const metaPath = `news-intelligence/${date}/newsletter-metadata.json`;
          if (!fs.existsSync(manifestPath) || !fs.existsSync(metaPath)) throw new Error(`No committed intelligence candidate for ${date}.`);
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          const meta = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
          const candidate = String(manifest.candidate_id || '').trim();
          if (!candidate) throw new Error('Current intelligence candidate has no candidate ID.');
          if (meta.candidate_id !== candidate) throw new Error('Internal candidate metadata mismatch; refusing release until the repository is consistent.');
          if (manifest.newsletter_ready_for_human_approval !== true) throw new Error('This candidate is not verification-ready.');
          if (Number(manifest.overall_confidence || 0) < 0.78) throw new Error('Candidate is below the release confidence threshold.');
          fs.appendFileSync(process.env.GITHUB_ENV, `NEWS_INTELLIGENCE_DATE=${date}\nNEWS_INTELLIGENCE_CANDIDATE_ID=${candidate}\n`);
          const alreadySent = meta.status === 'sent' && Boolean(meta.sent_at);
          const weeklyDir = `reports/weekly-intelligence/${date}`;
          const weeklyManifestPath = `${weeklyDir}/candidate-manifest.json`;
          let hasWeeklyPodcast = false;
          let weeklySlug = '';
          if (fs.existsSync(weeklyManifestPath)) {
            const weeklyManifest = JSON.parse(fs.readFileSync(weeklyManifestPath, 'utf8'));
            if (weeklyManifest.type !== 'sapiver_forge_weekly_intelligence_podcast') throw new Error('Unexpected weekly podcast candidate type.');
            if (weeklyManifest.week_end !== date) throw new Error('Weekly podcast date does not match the release date.');
            for (const [name, expected] of Object.entries(weeklyManifest.file_hashes || {})) {
              const file = `${weeklyDir}/${name}`;
              if (!fs.existsSync(file)) throw new Error(`Weekly podcast candidate file missing: ${name}`);
              const actual = require('crypto').createHash('sha256').update(fs.readFileSync(file)).digest('hex');
              if (actual !== expected) throw new Error(`Weekly podcast candidate hash mismatch: ${name}`);
            }
            const weeklyMeta = JSON.parse(fs.readFileSync(`${weeklyDir}/episode-metadata.json`, 'utf8'));
            weeklySlug = String(weeklyMeta.slug || '').trim();
            if (!/^[a-z0-9][a-z0-9-]*$/i.test(weeklySlug)) throw new Error('Weekly podcast candidate has an unsafe slug.');
            hasWeeklyPodcast = true;
            fs.appendFileSync(process.env.GITHUB_ENV, `PODCAST_REPORT_DIR=${weeklyDir}\nPODCAST_SLUG=${weeklySlug}\n`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${date}\ncandidate_id=${candidate}\nalready_sent=${alreadySent}\nhas_weekly_podcast=${hasWeeklyPodcast}\n`);
          console.log(alreadySent
            ? `Campaign for ${date} was already sent; continuing with the website deploy only.`
            : `Releasing current approved candidate ${candidate.slice(0, 12)}… for ${date}.`);
          NODE

      - name: Send reviewed campaign through established Brevo list
        if: steps.release.outputs.already_sent != 'true'
        env:
          BREVO_SEND_MODE: send
          NEWSLETTER_APPROVED: 'true'
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
        run: node src/send-daily-newsletter-brevo.mjs

      - name: Persist Brevo send receipt immediately
        if: steps.release.outputs.already_sent != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sapiver-forge-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "news-intelligence/${NEWS_INTELLIGENCE_DATE}/newsletter-metadata.json"
          if ! git diff --cached --quiet; then
            git commit -m "Record Daily Brief send ${NEWS_INTELLIGENCE_DATE} [skip ci]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase origin main
            done
          fi

      - name: Install locked website dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate and publish the approved Friday recap podcast
        if: steps.release.outputs.has_weekly_podcast == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-2.5-flash-preview-tts
          GEMINI_TTS_VOICE: Charon
          INPUT_PATH: ${{ env.PODCAST_REPORT_DIR }}/COPY_PASTE_INTO_ELEVENLABS.txt
          OUTPUT_PATH: ${{ runner.temp }}/sapiver-forge-weekly.wav
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "public/podcast/episodes/${PODCAST_SLUG}.mp3" ]; then
            echo "Weekly podcast ${PODCAST_SLUG} is already published; skipping generation."
            exit 0
          fi
          node scripts/generate-gemini-podcast-wav.mjs
          command -v ffmpeg >/dev/null || { echo "::error::ffmpeg is unavailable on this runner."; exit 1; }
          ffmpeg -hide_banner -loglevel error -y -i "${OUTPUT_PATH}" -codec:a libmp3lame -b:a 128k "${RUNNER_TEMP}/sapiver-forge-weekly.mp3"
          SOURCE_MP3="${RUNNER_TEMP}/sapiver-forge-weekly.mp3" \
          METADATA_PATH="${PODCAST_REPORT_DIR}/episode-metadata.json" \
          EPISODE_SLUG="${PODCAST_SLUG}" \
          PODCAST_KIND="weekly recap" \
          PODCAST_BASE_URL="https://suite.sapiverpress.co.uk" \
            node scripts/publish-podcast-feed.mjs
          mkdir -p public/posts
          cp "${PODCAST_REPORT_DIR}/weekly-article.html" "public/posts/${PODCAST_SLUG}.html"

      - name: Build the complete website and publish the approved candidate
        env:
          BLOG_BASE_URL: https://suite.sapiverpress.co.uk
        run: |
          node src/build-site.mjs
          node src/publish-news-intelligence-site.mjs
          node scripts/inject-news-intelligence-site.mjs

      - name: Commit website edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sapiver-forge-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "news-intelligence/${NEWS_INTELLIGENCE_DATE}/site-release.json" \
                  public/daily-brief/intelligence \
                  public/daily-brief/index.html \
                  public/podcast \
                  public/posts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Daily Brief ${NEWS_INTELLIGENCE_DATE} website edition [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

      - name: Deploy the complete website to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 47bda30e-4698-4cf5-bcd4-d59785e1f399
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN repository secret."
            exit 1
          fi
          npx --yes netlify-cli@latest deploy \
            --prod \
            --no-build \
            --dir=public \
            --site="${NETLIFY_SITE_ID}" \
            --auth="${NETLIFY_AUTH_TOKEN}" \
            --message="Publish Daily Brief, Sapiver Learn and AI Inquisitive Parents"
