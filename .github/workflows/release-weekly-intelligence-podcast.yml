name: Release Sapiver Forge Weekly Intelligence Podcast

on:
  workflow_dispatch:
    inputs:
      week_end:
        description: Exact week-end date (YYYY-MM-DD)
        required: true
        type: string
      candidate_id:
        description: Exact candidate ID from the reviewed weekly production package
        required: true
        type: string
      confirm:
        description: Type PUBLISH to release this exact podcast candidate
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sapiver-forge-weekly-intelligence-podcast-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact reviewed candidate and file hashes
        shell: bash
        env:
          WEEK: ${{ inputs.week_end }}
          REQUESTED_CANDIDATE: ${{ inputs.candidate_id }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "PUBLISH" ] || { echo "Confirmation must be exactly PUBLISH" >&2; exit 1; }
          echo "$WEEK" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const path=require('path');
          const week=process.env.WEEK;
          const requested=process.env.REQUESTED_CANDIDATE;
          const dir=path.join('reports','weekly-intelligence',week);
          const manifestPath=path.join(dir,'candidate-manifest.json');
          if(!fs.existsSync(manifestPath)) throw new Error(`No committed weekly podcast candidate for ${week}.`);
          const manifest=JSON.parse(fs.readFileSync(manifestPath,'utf8'));
          if(manifest.candidate_id!==requested) throw new Error('Candidate ID mismatch. Review the current weekly package and try again.');
          if(manifest.human_approval_required!==true || manifest.approved_for_automatic_publication!==false) throw new Error('Podcast approval contract changed unexpectedly.');
          if(!manifest.file_hashes?.['weekly-article.html']) throw new Error('Reviewed weekly article is not sealed into the candidate.');
          for(const [name,expected] of Object.entries(manifest.file_hashes||{})){
            const file=path.join(dir,name);
            if(!fs.existsSync(file)) throw new Error(`Sealed file missing: ${name}`);
            const actual=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(actual!==expected) throw new Error(`Reviewed file changed: ${name}`);
          }
          NODE
          echo "PODCAST_WEEK_END=$WEEK" >> "$GITHUB_ENV"
          echo "PODCAST_SLUG=${WEEK}-weekly-intelligence" >> "$GITHUB_ENV"

      - name: Release reviewed weekly article into public source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/posts public/features
          cp "reports/weekly-intelligence/${PODCAST_WEEK_END}/weekly-article.html" "public/posts/${PODCAST_SLUG}.html"
          cp "reports/weekly-intelligence/${PODCAST_WEEK_END}/weekly-article.html" "public/features/${PODCAST_SLUG}.html"

      - name: Generate MP3 with the existing podcast voice
        env:
          INPUT_PATH: reports/weekly-intelligence/${{ inputs.week_end }}/COPY_PASTE_INTO_ELEVENLABS.txt
          OUTPUT_PATH: reports/weekly-intelligence/${{ inputs.week_end }}/sapiver-forge-weekly-intelligence-${{ inputs.week_end }}.mp3
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLAB_API }}
        run: node scripts/generate-elevenlabs-mp3.mjs

      - name: Publish exact candidate into existing podcast RSS source
        env:
          SOURCE_MP3: reports/weekly-intelligence/${{ inputs.week_end }}/sapiver-forge-weekly-intelligence-${{ inputs.week_end }}.mp3
          METADATA_PATH: reports/weekly-intelligence/${{ inputs.week_end }}/episode-metadata.json
          PODCAST_KIND: weekly-intelligence
          EPISODE_SLUG: ${{ inputs.week_end }}-weekly-intelligence
          PODCAST_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: node scripts/publish-podcast-feed.mjs

      - name: Record podcast release and commit feed changes
        shell: bash
        env:
          REQUESTED_CANDIDATE: ${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const path=require('path');
          const week=process.env.PODCAST_WEEK_END;
          const dir=path.join('reports','weekly-intelligence',week);
          const mp3=path.join(dir,`sapiver-forge-weekly-intelligence-${week}.mp3`);
          const record={
            week_end:week,
            candidate_id:process.env.REQUESTED_CANDIDATE || '',
            released_at:new Date().toISOString(),
            mp3_sha256:crypto.createHash('sha256').update(fs.readFileSync(mp3)).digest('hex')
          };
          fs.writeFileSync(path.join(dir,'release.json'),JSON.stringify(record,null,2)+'\n');
          NODE
          git config user.name "sapiver-forge-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "reports/weekly-intelligence/${PODCAST_WEEK_END}" public/podcast \
                  "public/posts/${PODCAST_SLUG}.html" "public/features/${PODCAST_SLUG}.html"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Release weekly intelligence podcast ${PODCAST_WEEK_END} [skip ci]"
          git push
