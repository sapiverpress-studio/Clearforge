name: Repair Sapiver Forge Candidate 2026-08-02

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sapiver-forge-candidate-repair-2026-08-02
  cancel-in-progress: true

env:
  CLEARFORGE_DATE: "2026-08-02"
  ORIGINAL_ARTIFACT_ID: "8830323452"

jobs:
  repair-and-reseal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install only required Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Download original sealed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/original-candidate.zip"
          stage="$RUNNER_TEMP/original-candidate"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ORIGINAL_ARTIFACT_ID}/zip" > "$archive"
          mkdir -p "$stage"
          unzip -q "$archive" -d "$stage"
          test -f "$stage/drafts/${CLEARFORGE_DATE}/candidate-manifest.json"
          cp -a "$stage/." .

      - name: Apply deterministic factual and commercial repair
        run: node scripts/repair-2026-08-02-candidate.mjs

      - name: Remove superseded spoken media from this edition
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp3" \
            "drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp3.source-sha256" \
            "drafts/${CLEARFORGE_DATE}/podcast/clearforge-daily-podcast-${CLEARFORGE_DATE}.mp4" \
            "media/${CLEARFORGE_DATE}/narration.mp3" \
            "media/${CLEARFORGE_DATE}/tiktok-narration.mp3" \
            "public/podcast/episodes/${CLEARFORGE_DATE}.mp3" \
            "public/podcast/episodes/${CLEARFORGE_DATE}.mp4" \
            "public/podcast/episodes/${CLEARFORGE_DATE}.html" \
            "public/podcast/episodes/${CLEARFORGE_DATE}.txt"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'public/podcast';
          if (fs.existsSync(root)) {
            for (const name of fs.readdirSync(root)) {
              if (!name.endsWith('.xml')) continue;
              const file = path.join(root, name);
              const before = fs.readFileSync(file, 'utf8');
              const after = before.replace(/<item>[\s\S]*?2026-08-02[\s\S]*?<\/item>\s*/g, '');
              if (after !== before) fs.writeFileSync(file, after);
            }
          }
          NODE

      - name: Validate corrected text and absent superseded media
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E '38% of (U\.S\. )?workers|hardware-level isolation is required|requires disclosure for all AI interactions and synthetic media|visit for our release gate guide|COPY_PASTE_INTO_ELEVENLABS' "drafts/${CLEARFORGE_DATE}" public --include='*.md' --include='*.txt' --include='*.json' --include='*.html' --include='*.xml'
          test ! -e "public/podcast/episodes/${CLEARFORGE_DATE}.mp3"
          test ! -e "public/podcast/episodes/${CLEARFORGE_DATE}.mp4"

      - name: Build and seal replacement human-review candidate
        env:
          CLEARFORGE_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLEARFORGE_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run review:human

      - name: Read replacement candidate identity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          manifest="drafts/${CLEARFORGE_DATE}/candidate-manifest.json"
          candidate_id="$(jq -r '.candidate_id' "$manifest")"
          review_file="$(find "drafts/${CLEARFORGE_DATE}" -maxdepth 1 -name 'human-review-*.html' -type f | head -1)"
          test "${#candidate_id}" -eq 64
          test -f "$review_file"
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"
          echo "review_file=$review_file" >> "$GITHUB_OUTPUT"

      - name: Upload replacement sealed candidate
        uses: actions/upload-artifact@v4
        with:
          name: clearforge-candidate-2026-08-02-${{ steps.candidate.outputs.candidate_id }}
          path: |
            drafts/2026-08-02/
            media/2026-08-02/
            public/
            bridge/
          if-no-files-found: error
          retention-days: 30

      - name: Upload replacement human review
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-human-review-2026-08-02-${{ steps.candidate.outputs.candidate_id }}
          path: ${{ steps.candidate.outputs.review_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Email replacement review package
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REVIEW_EMAIL_TO: ${{ secrets.REVIEW_EMAIL_TO }}
        run: npm run review:email

      - name: Repair summary
        shell: bash
        run: |
          {
            echo "## Text-only replacement candidate ready"
            echo
            echo "- Edition: ${CLEARFORGE_DATE}"
            echo "- Replacement candidate: ${{ steps.candidate.outputs.candidate_id }}"
            echo "- Original candidate must not be released."
            echo "- Research and artwork were reused."
            echo "- Incorrect spoken media was removed rather than regenerated to protect GitHub runtime."
          } >> "$GITHUB_STEP_SUMMARY"
