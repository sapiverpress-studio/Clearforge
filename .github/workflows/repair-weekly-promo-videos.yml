name: Repair Existing Sapiver Forge Weekly Videos

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Exact 64-character candidate ID to repair
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sapiver-forge-weekly-video-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out renderer and approved product artwork
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            data
            src
            test
            public/products/gate-system/opportunity-gate/01_Cover.webp
            public/products/gate-system/workflow-control-gate/01_Cover.webp
            public/products/gate-system/output-release-gate/01_Cover.webp
            public/products/gate-system/outcome-review-gate/01_Cover.webp
            public/products/gate-system/complete-bundle/01_Cover.webp
            public/products/notion-workspace/01_Cover.webp
            .github/workflows/repair-weekly-promo-videos.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Check out approved Isla opener
        uses: actions/checkout@v4
        with:
          repository: sapiverpress-studio/SapiverPress_comic_public
          ref: main
          path: vendor/isla-source
          sparse-checkout: |
            assets/sapiver-forge/isla-hook.mp4
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download and verify existing candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ inputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$CID" | grep -Eq '^[a-f0-9]{64}$'
          row="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq ".artifacts|map(select(.name|contains(\"weekly-candidate-\"))|select(.name|endswith(\"-$CID\")))|sort_by(.created_at)|reverse|.[0]|[.id,.name]|@tsv")"
          test -n "$row"
          aid="${row%%$'\t'*}"
          source_name="${row#*$'\t'}"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip" > candidate.zip
          mkdir repaired
          unzip -q candidate.zip -d repaired
          test "$(tr -d '\n' < repaired/candidate-id.txt)" = "$CID"
          (cd repaired && sha256sum -c file-hashes.sha256)
          test "$(find repaired/audio -type f -name '*.mp3' | wc -l)" -eq 7
          test -f repaired/weekly-pack.json
          echo "SOURCE_ARTIFACT=$source_name" >> "$GITHUB_ENV"
          echo "WEEK_ID=$(node -p "require('./repaired/weekly-pack.json').week")" >> "$GITHUB_ENV"

      - name: Verify visual assets
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/isla-source/assets/sapiver-forge/isla-hook.mp4
          node <<'NODE'
          const fs=require('fs');
          const pack=JSON.parse(fs.readFileSync('repaired/weekly-pack.json','utf8'));
          for(const post of pack.posts){
            if(!post.product_image || !fs.existsSync(post.product_image) || fs.statSync(post.product_image).size===0){
              throw new Error(`Missing approved product artwork for day ${post.index}: ${post.product_image}`);
            }
          }
          NODE

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Rerender seven videos using existing narration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf repaired/video
          mkdir -p repaired/video
          node - <<'NODE' > "$RUNNER_TEMP/items.tsv"
          const p=require('./repaired/weekly-pack.json');
          for(const x of p.posts) console.log([String(x.index).padStart(2,'0'),x.index,x.day.toLowerCase()].join('\t'));
          NODE
          while IFS=$'\t' read -r num index day; do
            audio="repaired/audio/$num-$day.mp3"
            video="repaired/video/$num-$day.mp4"
            test -s "$audio"
            node src/render-weekly-promo-video.mjs repaired/weekly-pack.json "$index" "$audio" "$video"
            test -s "$video"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")" = "1080x1920"
          done < "$RUNNER_TEMP/items.tsv"
          test "$(find repaired/video -type f -name '*.mp4' | wc -l)" -eq 7

      - name: Reseal repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f repaired/file-hashes.sha256
          (cd repaired && find . -type f ! -name 'file-hashes.sha256' -print0 | sort -z | xargs -0 sha256sum > file-hashes.sha256)
          (cd repaired && sha256sum -c file-hashes.sha256)
          echo "Repair source: $SOURCE_ARTIFACT" >> repaired/README.txt
          echo "Repair: existing narration reused; videos rerendered with no visible URL and LINK IN BIO CTA." >> repaired/README.txt
          rm -f repaired/file-hashes.sha256
          (cd repaired && find . -type f ! -name 'file-hashes.sha256' -print0 | sort -z | xargs -0 sha256sum > file-hashes.sha256)
          (cd repaired && sha256sum -c file-hashes.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-weekly-candidate-repaired-${{ env.WEEK_ID }}-${{ inputs.candidate_id }}
          path: repaired/
          retention-days: 30
