name: Generate Sapiver Forge Weekly Content Kit

on:
  workflow_dispatch:
    inputs:
      week_id:
        description: Optional week label (YYYY-MM-DD). Leave blank to use today.
        required: false
        type: string
  schedule:
    - cron: '5 5 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/weekly-content-kit.yml'
      - 'src/generate-fresh-weekly-promo-pack.mjs'
      - 'test/weekly-promo-contract.mjs'
      - 'data/sapiver-forge-products.json'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: sapiver-forge-weekly-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Sapiver Forge
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve week ID
        id: week
        shell: bash
        env:
          REQUESTED_WEEK: ${{ inputs.week_id }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_WEEK:-}" ]; then
            WEEK_ID="$REQUESTED_WEEK"
          else
            WEEK_ID="$(TZ=Europe/London date +%F)"
          fi
          if ! echo "$WEEK_ID" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "week_id must use YYYY-MM-DD" >&2
            exit 1
          fi
          echo "week_id=$WEEK_ID" >> "$GITHUB_OUTPUT"

      - name: Validate content-only contract
        env:
          WEEK_ID: contract-test
        run: node test/weekly-promo-contract.mjs

      - name: Generate fresh weekly content kit
        env:
          WEEK_ID: ${{ steps.week.outputs.week_id }}
        run: node src/generate-fresh-weekly-promo-pack.mjs

      - name: Verify no generated media
        env:
          WEEK_ID: ${{ steps.week.outputs.week_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="weekly-output/$WEEK_ID"
          test -s "$OUT/weekly-content-kit.md"
          test -s "$OUT/human-review.html"
          test -s "$OUT/weekly-pack.json"
          test ! -d "$OUT/audio"
          test ! -d "$OUT/video"
          node - <<'NODE'
          const fs = require('fs');
          const week = process.env.WEEK_ID;
          const p = JSON.parse(fs.readFileSync(`weekly-output/${week}/weekly-pack.json`, 'utf8'));
          if (p.generation.paid_media_calls !== 0) throw new Error('Paid media calls must remain zero.');
          if (p.generation.automated_audio || p.generation.automated_video) throw new Error('Automated media generation must remain disabled.');
          if (p.posts.filter(x => x.purpose === 'paid-offer-promotion').length !== 1) throw new Error('Expected exactly one direct paid promotion.');
          if (p.posts.filter(x => /Notion/i.test(x.destination_name)).length !== 6) throw new Error('Expected six free Notion/list-growth routes.');
          NODE

      - name: Publish latest content bridge for comic
        env:
          WEEK_ID: ${{ steps.week.outputs.week_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="weekly-output/$WEEK_ID"
          BRIDGE="bridge/sapiver-forge-weekly/latest"
          rm -rf "$BRIDGE"
          mkdir -p "$BRIDGE"
          cp "$OUT/weekly-pack.json" "$BRIDGE/weekly-pack.json"
          cp "$OUT/candidate-id.txt" "$BRIDGE/candidate-id.txt"
          cp "$OUT/weekly-content-kit.md" "$BRIDGE/weekly-content-kit.md"
          cp "$OUT/human-review.html" "$BRIDGE/human-review.html"
          cp "$OUT/README.txt" "$BRIDGE/README.txt"
          node <<'NODE'
          const fs = require('fs');
          const facts = JSON.parse(fs.readFileSync('data/sapiver-forge-products.json','utf8'));
          const pack = JSON.parse(fs.readFileSync(`weekly-output/${process.env.WEEK_ID}/weekly-pack.json`,'utf8'));
          const byName = Object.fromEntries(facts.products.map(p => [p.name, p]));
          const posts = pack.posts.map(p => {
            const product = byName[p.destination_name];
            const isPaid = p.purpose === 'paid-offer-promotion';
            return {
              ...p,
              publish_url: isPaid ? p.destination_url : facts.free_workspace_url,
              static_image: product?.image || (isPaid ? 'public/products/gate-system/complete-bundle/01_Cover.webp' : 'public/products/notion-workspace/01_Cover.webp'),
              pinterest_title: p.hook.replace(/[.?]$/,''),
              pinterest_description: `${p.practical_point}\n\n${p.cta}\n\n${p.hashtags.join(' ')}`,
              social_comment: `Link in bio. ${p.hashtags.join(' ')}`
            };
          });
          const manifest = {
            schema_version: 4,
            approved_for_automatic_distribution: true,
            candidate_id: pack.candidate_id,
            week: pack.week,
            generated_at: pack.generated_at,
            plan: pack.plan,
            generation: pack.generation,
            posts
          };
          fs.writeFileSync('bridge/sapiver-forge-weekly/latest/distribution-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          (cd "$BRIDGE" && find . -type f ! -name file-hashes.sha256 -print0 | sort -z | xargs -0 sha256sum > file-hashes.sha256)
          (cd "$BRIDGE" && sha256sum -c file-hashes.sha256)
          git config user.name "sapiver-forge-content-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$BRIDGE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish latest Sapiver Forge weekly content bridge [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

      - name: Upload weekly content kit
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-weekly-content-${{ steps.week.outputs.week_id }}-${{ github.run_number }}
          path: weekly-output/${{ steps.week.outputs.week_id }}/
          retention-days: 30
          if-no-files-found: error
