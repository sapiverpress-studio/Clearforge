name: Build Sapiver Forge Weekly Intelligence Podcast

on:
  workflow_dispatch:
    inputs:
      week_end:
        description: Optional week-end date (YYYY-MM-DD). Leave blank for today in Europe/London.
        required: false
        type: string
  schedule:
    - cron: '20 8 * * 6'
  push:
    branches:
      - feature/daily-intelligence-weekly-podcast
    paths:
      - '.github/workflows/weekly-intelligence-podcast.yml'
      - '.github/workflows/release-weekly-intelligence-podcast.yml'
      - 'src/generate-weekly-intelligence-podcast.mjs'

permissions:
  contents: write

concurrency:
  group: sapiver-forge-weekly-intelligence-podcast-build
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check src/generate-weekly-intelligence-podcast.mjs

  build:
    if: github.event_name != 'push'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve week
        shell: bash
        env:
          REQUESTED_WEEK: ${{ inputs.week_end }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_WEEK:-}" ]; then
            WEEK="$REQUESTED_WEEK"
          else
            WEEK="$(TZ=Europe/London date +%F)"
          fi
          echo "$WEEK" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "PODCAST_WEEK_END=$WEEK" >> "$GITHUB_ENV"
          echo "PODCAST_SLUG=${WEEK}-weekly-intelligence" >> "$GITHUB_ENV"

      - name: Generate sealed weekly synthesis candidate
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_WEEK_END: ${{ env.PODCAST_WEEK_END }}
          BLOG_BASE_URL: https://sapiverforge-daily-brief.netlify.app
        run: node src/generate-weekly-intelligence-podcast.mjs

      - name: Verify candidate remains human-gated
        run: |
          node <<'NODE'
          const fs=require('fs');
          const week=process.env.PODCAST_WEEK_END;
          const p=JSON.parse(fs.readFileSync(`reports/weekly-intelligence/${week}/candidate-manifest.json`,'utf8'));
          if(p.approved_for_automatic_publication!==false) throw new Error('Weekly podcast must not auto-publish.');
          if(p.human_approval_required!==true) throw new Error('Human approval requirement missing.');
          if(!p.candidate_id) throw new Error('Candidate ID missing.');
          console.log(`Review candidate: ${p.candidate_id}`);
          NODE

      - name: Commit weekly podcast candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sapiver-forge-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "reports/weekly-intelligence/${PODCAST_WEEK_END}" \
                  "public/posts/${PODCAST_SLUG}.html" \
                  "public/features/${PODCAST_SLUG}.html"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build weekly intelligence podcast candidate ${PODCAST_WEEK_END} [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

      - name: Upload weekly review package
        uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-weekly-intelligence-${{ env.PODCAST_WEEK_END }}-${{ github.run_number }}
          path: reports/weekly-intelligence/${{ env.PODCAST_WEEK_END }}/
          retention-days: 30
          if-no-files-found: error
