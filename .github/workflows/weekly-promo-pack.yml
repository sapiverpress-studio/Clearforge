name: Generate Sapiver Forge Weekly Promo Pack
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
concurrency:
  group: sapiver-forge-weekly-promo
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out weekly generator and approved product artwork
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            data
            src
            test
            public/products/gate-system/opportunity-gate/01_Cover.webp
            public/products/gate-system/workflow-control-gate/01_Cover.webp
            public/products/gate-system/output-release-gate/01_Cover.webp
            public/products/gate-system/outcome-review-gate/01_Cover.webp
            public/products/gate-system/complete-bundle/01_Cover.webp
            public/products/notion-workspace/01_Cover.webp
            .github/workflows/weekly-promo-pack.yml
            .github/workflows/approve-weekly-promo.yml
            .github/workflows/repair-weekly-promo-videos.yml
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Check out the existing approved Isla movement opener
        uses: actions/checkout@v4
        with:
          repository: sapiverpress-studio/SapiverPress_comic_public
          ref: main
          path: vendor/isla-source
          sparse-checkout: |
            assets/sapiver-forge/isla-hook.mp4
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify visual assets before generation or paid calls
        shell: bash
        run: |
          set -euo pipefail
          test -s vendor/isla-source/assets/sapiver-forge/isla-hook.mp4
          node <<'NODE'
          const fs=require('fs');
          const facts=JSON.parse(fs.readFileSync('data/sapiver-forge-products.json','utf8'));
          for(const product of facts.products){
            if(!product.image || !fs.existsSync(product.image) || fs.statSync(product.image).size===0){
              throw new Error(`Missing approved product artwork: ${product.slug} -> ${product.image}`);
            }
          }
          console.log(`Verified Isla opener and ${facts.products.length} approved product images.`);
          NODE
      - run: echo "WEEK_ID=$(TZ=Europe/London date +%F)" >> "$GITHUB_ENV"
      - run: npm run promo:generate
      - run: npm run promo:validate
        env:
          WEEK_ID: contract-test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify runner storage before paid calls
        shell: bash
        run: |
          set -euo pipefail
          df -h . "$RUNNER_TEMP"
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$available_kb" -lt 3145728 ]; then
            echo "::error::Less than 3 GB free before ElevenLabs calls; refusing to spend API credits."
            exit 1
          fi
      - name: Generate seven narration MP3s and Isla-led product MP4s
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLAB_API }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'w9xM4Spfmuw28ZXAirWK' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ELEVENLABS_API_KEY"
          OUT="weekly-output/$WEEK_ID"
          PACK="$OUT/weekly-pack.json"
          mkdir -p "$OUT/audio" "$OUT/video"
          node - <<'NODE' > "$RUNNER_TEMP/items.tsv"
          const p=require('./weekly-output/'+process.env.WEEK_ID+'/weekly-pack.json');for(const x of p.posts)console.log([String(x.index).padStart(2,'0'),x.index,x.day.toLowerCase(),Buffer.from(x.narration).toString('base64')].join('\t'));
          NODE
          while IFS=$'\t' read -r num index day n64; do
            narration="$(printf '%s' "$n64"|base64 -d)"
            audio="$OUT/audio/$num-$day.mp3"
            video="$OUT/video/$num-$day.mp4"
            temp_audio="$RUNNER_TEMP/$num-$day.mp3.part"
            rm -f "$temp_audio"
            payload="$(node -e 'console.log(JSON.stringify({text:process.argv[1],model_id:"eleven_multilingual_v2",voice_settings:{stability:.5,similarity_boost:.75}}))' "$narration")"
            curl --fail --silent --show-error --retry 2 --retry-all-errors -X POST "https://api.elevenlabs.io/v1/text-to-speech/$ELEVENLABS_VOICE_ID" -H "xi-api-key: $ELEVENLABS_API_KEY" -H 'content-type: application/json' -d "$payload" -o "$temp_audio"
            test -s "$temp_audio"
            mv "$temp_audio" "$audio"
            test -s "$audio"
            node src/render-weekly-promo-video.mjs "$PACK" "$index" "$audio" "$video"
            test -s "$video"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$video")" = "1080x1920"
          done < "$RUNNER_TEMP/items.tsv"
      - name: Seal candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="weekly-output/$WEEK_ID"
          ID="$(cat "$OUT/candidate-id.txt")"
          rm -f "$OUT/file-hashes.sha256"
          (cd "$OUT" && find . -type f ! -name 'file-hashes.sha256' -print0 | sort -z | xargs -0 sha256sum > file-hashes.sha256)
          (cd "$OUT" && sha256sum -c file-hashes.sha256)
          echo "CANDIDATE_ID=$ID" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: sapiver-forge-weekly-candidate-${{ env.WEEK_ID }}-${{ env.CANDIDATE_ID }}
          path: weekly-output/${{ env.WEEK_ID }}/
          retention-days: 30
