name: Publish Next Approved Sapiver Forge YouTube Short
on:
  workflow_dispatch:
    inputs:
      day_number:
        description: Optional 1-7 override
        required: false
  schedule:
    - cron: '00 17 * * *'
permissions:
  actions: read
  contents: write
concurrency:
  group: sapiver-forge-youtube-daily
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download latest approved pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          row="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts|map(select(.name|startswith("sapiver-forge-weekly-approved-")))|sort_by(.created_at)|reverse|.[0]|[.id,.name]|@tsv')"; test -n "$row"; aid="${row%%$'\t'*}"; gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$aid/zip">approved.zip; mkdir approved; unzip -q approved.zip -d approved
      - name: Select item
        env:
          OVERRIDE: ${{ inputs.day_number }}
        run: |
          day="${OVERRIDE:-$(TZ=Europe/London date +%u)}"; echo "$day"|grep -Eq '^[1-7]$'
          node - "$day" <<'NODE' >> "$GITHUB_ENV"
          const fs=require('fs'),d=Number(process.argv[2]),p=JSON.parse(fs.readFileSync('approved/weekly-pack.json')),x=p.posts.find(v=>v.index===d);if(!x)throw Error('Day missing');const q=s=>String(s).replace(/%/g,'%25').replace(/\n/g,'%0A').replace(/\r/g,'%0D');console.log('TITLE='+q(x.youtube_title));console.log('DESCRIPTION='+q(x.youtube_description));console.log('VIDEO_PATH=approved/video/'+String(d).padStart(2,'0')+'-'+x.day.toLowerCase()+'.mp4');console.log('MARKER=.youtube-uploaded/'+p.candidate_id+'-'+d+'.json');
          NODE
          test ! -f "$MARKER" || { echo 'Already uploaded'; exit 0; }
      - name: Upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_PATH: ${{ env.VIDEO_PATH }}
          TITLE: ${{ env.TITLE }}
          DESCRIPTION: ${{ env.DESCRIPTION }}
        run: npm run youtube:upload|tee upload-result.json
      - name: Record upload
        run: |
          mkdir -p .youtube-uploaded; cp upload-result.json "$MARKER"; git config user.name sapiver-forge-bot; git config user.email actions@users.noreply.github.com; git add "$MARKER"; git commit -m 'Record approved YouTube Short upload [skip ci]'; git push
